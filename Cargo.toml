[workspace]
members = ["core", "cli", "wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
version = "1.0.1"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
ruzstd = "0.9"
wasm-bindgen = "=0.2.122"
