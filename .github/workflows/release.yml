name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: cargo install wasm-pack --locked --version 0.15.0
      - working-directory: js
        run: npm install && npm run build && npm test && npm pack
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" js/wasm-search-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
