name: Deploy EdgeOne Pages

on:
  workflow_run:
    workflows: [ 'Build Corpus Artifact', 'Build Academics Artifact' ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful product assembly run id to deploy. Leave empty to use the latest successful run.'
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  resolve-edgeone:
    if: vars.EDGEONE_PAGES_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    permissions:
      actions: read
      contents: read
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      run_id: ${{ steps.resolve.outputs.run_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6

      - name: Resolve verified product artifact run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event.inputs.run_id || '' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          has_dist_artifact() {
            local candidate_run_id="$1"
            local count
            count="$(bash .github/scripts/gh-api-with-retry.sh "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts" \
              --jq '[.artifacts[] | select(.name == "njupt-search-dist" and .expired == false)] | length')"
            [ "$count" != "0" ]
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            latest_sha="$(bash .github/scripts/gh-api-with-retry.sh "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$WORKFLOW_RUN_SHA" != "$latest_sha" ]; then
              echo "workflow_run SHA $WORKFLOW_RUN_SHA is not current main $latest_sha; skipping stale EdgeOne deploy."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            run_id="$WORKFLOW_RUN_ID"
            if ! has_dist_artifact "$run_id"; then
              echo "Product assembly run $run_id has no njupt-search-dist artifact; skipping EdgeOne deploy."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
            if ! has_dist_artifact "$run_id"; then
              echo "::error::Product assembly run $run_id has no unexpired njupt-search-dist artifact"
              exit 1
            fi
          else
            run_id=""
            for candidate_run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --status success --limit 50 --json databaseId,workflowName,createdAt --jq '[.[] | select(.workflowName == "Build Corpus Artifact" or .workflowName == "Build Academics Artifact")] | sort_by(.createdAt) | reverse | .[].databaseId'); do
              if has_dist_artifact "$candidate_run_id"; then
                run_id="$candidate_run_id"
                break
              fi
            done
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful product build with an unexpired njupt-search-dist artifact found for EdgeOne deployment"
            exit 1
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  deploy-edgeone:
    needs: resolve-edgeone
    if: needs.resolve-edgeone.outputs.should_deploy == 'true'
    permissions:
      actions: read
      contents: read
    concurrency:
      group: production-publish-main
      cancel-in-progress: false
    environment:
      name: edgeone-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v6

      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.resolve-edgeone.outputs.run_id }}
        run: bash .github/scripts/download-artifact-with-retry.sh "$RUN_ID" "$GITHUB_REPOSITORY" njupt-search-dist dist

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Prepare verified product for middleware compilation
        run: node .github/scripts/prepare-edgeone-project.mjs

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'njupt-search' }}
          EDGEONE_PAGES_AREA: ${{ vars.EDGEONE_PAGES_AREA || 'global' }}
        run: |
          set -o pipefail
          if [ -z "$EDGEONE_API_TOKEN" ]; then
            echo "::error::EDGEONE_API_TOKEN secret is required"
            exit 1
          fi
          project="${EDGEONE_PROJECT_NAME:-njupt-search}"
          area="${EDGEONE_PAGES_AREA:-global}"
          echo "Deploying verified CI artifact to EdgeOne Makers project '$project' in area '$area'."
          bash .github/scripts/deploy-edgeone-with-retry.sh "" "$project" production "$area" edgeone-deploy.json
          EDGEONE_DEPLOY_RESULT_PATH=edgeone-deploy.json \
          EDGEONE_PRODUCT_RUN_ID='${{ needs.resolve-edgeone.outputs.run_id }}' \
          EDGEONE_PROJECT="$project" \
          EDGEONE_AREA="$area" \
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const result = JSON.parse(readFileSync(process.env.EDGEONE_DEPLOY_RESULT_PATH, 'utf8'));
          const summary = [
            '### EdgeOne Makers deployment',
            '',
            `- Product assembly run: \`${process.env.EDGEONE_PRODUCT_RUN_ID}\``,
            `- Project: \`${process.env.EDGEONE_PROJECT}\``,
            `- Area: \`${process.env.EDGEONE_AREA}\``,
            `- Deployment URL: ${result.url}`,
            `- Type: \`${result.type}\``,
            `- Project ID: \`${result.projectId}\``,
            `- Deployment ID: \`${result.deploymentId}\``,
            `- Console: ${result.consoleUrl}`,
            '',
          ].join('\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Purge Cloudflare Cache
        if: ${{ vars.CF_PURGE_ENABLED == '1' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ZONE_ID}" ]; then
            echo "Skip purge: CF_API_TOKEN or CF_ZONE_ID is not set."
            exit 0
          fi
          if ! curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'; then
            echo "::warning::Cloudflare cache purge failed; static site deployments already completed."
          fi
